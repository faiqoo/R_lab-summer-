tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/traefik/cert.pem
        keyFile: /etc/ssl/traefik/privkey.pem
  certificates:
    - certFile: /etc/ssl/traefik/cert.pem
      keyFile: /etc/ssl/traefik/privkey.pem

providers:
  docker:
    tls:
      insecureSkipVerify: true
http:
  serversTransports:
    isle-dc-nifi:
      insecureSkipVerify: true
