networks:
  default:
    internal: true
volumes:
  qdrant-data:
    driver: local
    name: qdrant-data
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - type: volume
        source: qdrant-data
        target: /qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"       # REST API + gRPC
      - "${QDRANT_DASHBOARD_PORT:-6334}:6334"  # Web dashboard
    networks:
      default:
