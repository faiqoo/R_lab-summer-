repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^rag/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^rag/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd rag && uv run mypy src/'
        language: system
        types: [python]
        pass_filenames: false
        #additional_dependencies: [types-requests, pdfplumber]

      - id: pytest
        name: pytest
        entry: bash -c 'cd rag && uv run pytest --tb=short'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
