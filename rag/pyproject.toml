[project]
name = "archival-rag"
version = "0.1.0"
description = "RAG pipeline and LLM integration for the Islandora Archival Chatbot (Summer 2026 lab)"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawki_langchain"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]

[dependency-groups]
dev = [
    "black>=24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "langchain-core>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
